name: Main branch audit

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  direct_push_audit:
    name: direct_push_audit
    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Verify main commit came from a merged PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          owner="${REPO%/*}"
          repo_name="${REPO#*/}"
          short_sha="${SHA:0:7}"

          if [[ "$repo_name" == "software-repo-template" ]]; then
            echo "Skipping direct-push audit for the repository template itself."
            exit 0
          fi

          parent_count="$(gh api "repos/$REPO/commits/$SHA" --jq '.parents | length')"
          if [[ "$parent_count" == "0" ]]; then
            echo "Skipping direct-push audit for initial repository commit."
            exit 0
          fi

          # GitHub can deliver the push before the squash merge's commit-to-PR
          # association is queryable. Retry that eventually consistent lookup
          # before creating a direct-push incident.
          merged_pr_count="0"
          for association_attempt in {1..12}; do
            merged_pr_count="$(gh api graphql \
              -f owner="$owner" \
              -f name="$repo_name" \
              -f oid="$SHA" \
              -f query='query($owner:String!, $name:String!, $oid:GitObjectID!) { repository(owner:$owner, name:$name) { object(oid:$oid) { ... on Commit { associatedPullRequests(first:10) { nodes { number title url merged } } } } } }' \
              --jq '[.data.repository.object.associatedPullRequests.nodes[] | select(.merged == true)] | length')"

            if [[ "$merged_pr_count" != "0" ]]; then
              break
            fi

            if [[ "$association_attempt" != "12" ]]; then
              echo "::notice::Merged-PR association is not indexed yet; retrying in 5 seconds (attempt $association_attempt of 12)."
              sleep 5
            fi
          done

          if [[ "$merged_pr_count" != "0" ]]; then
            echo "main commit $SHA is associated with $merged_pr_count merged PR(s)."
            exit 0
          fi

          issue_title="Direct push to main detected: $short_sha"
          existing_issue="$(gh issue list --repo "$REPO" --state open --search "$issue_title in:title" --json number --jq '.[0].number // empty')"

          if [[ -z "$existing_issue" ]]; then
            body_file="$(mktemp)"
            cat > "$body_file" <<BODY
          A push to \`main\` produced commit \`$SHA\` without an associated merged pull request.

              This repository requires pull-request-based changes. Investigate whether this was intentional break-glass work or should be reverted and replayed through the normal PR flow.
          BODY
            gh issue create --repo "$REPO" --title "$issue_title" --body-file "$body_file" || true
          else
            echo "::notice::Existing direct-push audit issue #$existing_issue already exists."
          fi

          echo "::error::main commit $SHA is not associated with a merged PR."
          exit 1
