name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate shell scripts
        run: >-
          bash -n
          bin/accept-installed-codex-baseline
          bin/test-acceptance-evidence
          bin/test-acceptance-contract
          bin/test-acceptance-primitives
          bin/ci
          bin/container
          bin/dependency-merge-steward
          bin/mark-staging-candidate
          bin/nominate-release-candidate
          bin/preflight-production
          bin/record-production-deployment
          bin/record-product-acceptance
          bin/release-gate
          bin/verify-acceptance-evidence

      - name: Run project checks
        run: bin/ci
