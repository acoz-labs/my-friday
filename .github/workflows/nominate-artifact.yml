name: Nominate artifact candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full successful main commit SHA
        required: true
        type: string

permissions:
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  nominate:
    name: nominate_artifact
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.DELIVERY_PROFILE == 'artifact'
    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout immutable candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Build exact Apple silicon executable
        run: |
          set -euo pipefail
          mkdir -p candidate
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o candidate/my-friday ./cmd/my-friday
          chmod 0755 candidate/my-friday

      - name: Upload immutable executable
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: my-friday-darwin-arm64
          path: candidate/my-friday
          if-no-files-found: error
          retention-days: 30

      - name: Bind executable authority
        id: authority
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          digest="$(sha256sum candidate/my-friday | awk '{print $1}')"
          authority="artifact-v1:run=${GITHUB_RUN_ID}:id=${ARTIFACT_ID}:name=my-friday-darwin-arm64:sha256=${digest}"
          echo "authority=$authority" >> "$GITHUB_OUTPUT"
          echo "Accepted executable SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify and nominate artifact
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ steps.authority.outputs.authority }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_REQUIRED: "false"
        run: |
          set -euo pipefail
          bin/release-gate "$RELEASE_SHA"
          bin/nominate-release-candidate \
            "$RELEASE_SHA" \
            "$RELEASE_ARTIFACT" \
            artifact \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.run_id }}" \
            application
