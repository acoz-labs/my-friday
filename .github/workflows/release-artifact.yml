name: Release artifact

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full accepted commit SHA
        required: true
        type: string
      artifact:
        description: Accepted immutable artifact identifier or digest
        required: true
        type: string
      issues:
        description: Comma-separated issue numbers included in the release
        required: true
        type: string
      summary:
        description: Release summary
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  release:
    name: release_artifact
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.DELIVERY_PROFILE == 'artifact'
    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout accepted candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify exact accepted artifact
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_REQUIRED: "false"
        run: bin/release-gate --require-acceptance "$RELEASE_SHA"

      - name: Parse accepted artifact authority
        id: artifact
        env:
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          IFS=: read -r scheme run_id artifact_id digest_scheme digest extra <<< "$RELEASE_ARTIFACT"
          [[ "$scheme" == actions && "$run_id" =~ ^[0-9]+$ && "$artifact_id" =~ ^[0-9]+$ && "$digest_scheme" == sha256 && "$digest" =~ ^[0-9a-f]{64}$ && -z "$extra" ]]
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
          echo "artifact-id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Bind accepted artifact identity
        id: artifact_identity
        env:
          ACCEPTED_RUN_ID: ${{ steps.artifact.outputs.run-id }}
          ACCEPTED_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ACCEPTED_ARTIFACT_NAME: my-friday-darwin-arm64-${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ACCEPTED_ARTIFACT_ID}")"
          [[ "$(jq -r '.id' <<< "$artifact_json")" == "$ACCEPTED_ARTIFACT_ID" ]]
          [[ "$(jq -r '.workflow_run.id' <<< "$artifact_json")" == "$ACCEPTED_RUN_ID" ]]
          [[ "$(jq -r '.name' <<< "$artifact_json")" == "$ACCEPTED_ARTIFACT_NAME" ]]
          [[ "$(jq -r '.expired' <<< "$artifact_json")" == "false" ]]
          echo "name=$ACCEPTED_ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Download accepted bytes
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact_identity.outputs.name }}
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ steps.artifact.outputs.run-id }}

      - name: Verify accepted-byte digest
        env:
          EXPECTED_DIGEST: ${{ steps.artifact.outputs.digest }}
        run: |
          set -euo pipefail
          actual="$(sha256sum dist/my-friday-darwin-arm64 | awk '{print $1}')"
          [[ "$actual" == "$EXPECTED_DIGEST" ]]

      - name: Verify issue-specific release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          RELEASE_ARTIFACT_NAME: ${{ steps.artifact_identity.outputs.name }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.artifact.outputs.digest }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: bin/finalize-release artifact --preflight

      - name: Publish artifact ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          RELEASE_ARTIFACT_NAME: ${{ steps.artifact_identity.outputs.name }}
          RELEASE_ARTIFACT_SHA256: ${{ steps.artifact.outputs.digest }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
          RELEASE_ASSET_PATH: dist/my-friday-darwin-arm64
        run: bin/finalize-release artifact
