name: Release production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full accepted commit SHA to promote
        required: true
        type: string
      artifact:
        description: Immutable staged artifact identifier or digest
        required: true
        type: string
      issues:
        description: Comma-separated issue numbers included in the release
        required: true
        type: string
      summary:
        description: Release summary
        required: true
        type: string
      rollback:
        description: Previous release or explicit rollback command
        required: true
        type: string
      operation:
        description: Promote the candidate, or resume verification/finalization for an existing successful receipt
        required: true
        default: promote-and-finalize
        type: choice
        options:
          - promote-and-finalize
          - finalize-only
          - force-promote-and-finalize

permissions:
  checks: read
  contents: write
  deployments: write
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  release:
    name: release_production
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.PRODUCTION_ENABLED == 'true'
    runs-on: ${{ vars.CI_RUNNER }}
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - name: Checkout accepted candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0

      - name: Verify release gate
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_ENVIRONMENT: ${{ vars.STAGING_ENVIRONMENT }}
          STAGING_REQUIRED: ${{ vars.STAGING_REQUIRED }}
        run: bin/release-gate --require-acceptance "$RELEASE_SHA"

      - name: Verify issue-specific release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: bin/finalize-release production --preflight

      - name: Run production readiness preflight
        env:
          PRODUCTION_ACTIVATION_MODE: ${{ vars.PRODUCTION_ACTIVATION_MODE }}
          PRODUCTION_ENABLED: ${{ vars.PRODUCTION_ENABLED }}
          PRODUCTION_REQUIRED_SECRETS: ${{ vars.PRODUCTION_REQUIRED_SECRETS }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ROLLBACK: ${{ inputs.rollback }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: bin/preflight-production

      - name: Resolve exact-candidate production receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CONTROL_SHA: ${{ github.sha }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_ROLLBACK: ${{ inputs.rollback }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          case "${{ inputs.operation }}" in
            finalize-only)
              receipt="$(bin/record-production-deployment resume \
                "$RELEASE_SHA" "$RELEASE_ARTIFACT" "$RELEASE_ISSUES" "$RELEASE_ROLLBACK")"
              ;;
            force-promote-and-finalize)
              receipt="$(bin/record-production-deployment start \
                "$RELEASE_SHA" "$RELEASE_ARTIFACT" "$RELEASE_ISSUES" "$RELEASE_ROLLBACK" --force)"
              ;;
            *)
              receipt="$(bin/record-production-deployment start \
                "$RELEASE_SHA" "$RELEASE_ARTIFACT" "$RELEASE_ISSUES" "$RELEASE_ROLLBACK")"
              ;;
          esac
          echo "deployment_id=$(jq -r .deployment_id <<< "$receipt")" >> "$GITHUB_OUTPUT"
          echo "already_successful=$(jq -r .already_successful <<< "$receipt")" >> "$GITHUB_OUTPUT"
          echo "already_promoted=$(jq -r .already_promoted <<< "$receipt")" >> "$GITHUB_OUTPUT"
          echo "control_sha=$(jq -r .receipt.control_sha <<< "$receipt")" >> "$GITHUB_OUTPUT"

      - name: Probe an ambiguously interrupted promotion
        id: recovery_probe
        if: steps.receipt.outputs.already_promoted != 'true' && inputs.operation != 'force-promote-and-finalize'
        env:
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set +e
          bin/verify-production-candidate "$RELEASE_ARTIFACT" "$RELEASE_SHA"
          probe_status=$?
          set -e
          case "$probe_status" in
            0) echo "state=active" >> "$GITHUB_OUTPUT" ;;
            3) echo "state=inactive" >> "$GITHUB_OUTPUT" ;;
            *) echo "Production candidate state is inconclusive; refusing to promote." >&2; exit "$probe_status" ;;
          esac

      - name: Recover promoted receipt
        id: recovery_receipt
        if: steps.recovery_probe.outputs.state == 'active'
        env:
          DEPLOYMENT_ID: ${{ steps.receipt.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: >-
          bin/record-production-deployment finish "$DEPLOYMENT_ID" promoted
          "$PRODUCTION_URL"

      - name: Deploy immutable production candidate
        id: deploy
        if: >-
          inputs.operation != 'finalize-only' &&
          steps.receipt.outputs.already_promoted != 'true' &&
          (inputs.operation == 'force-promote-and-finalize' ||
           steps.recovery_probe.outputs.state == 'inactive')
        continue-on-error: true
        env:
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test -x bin/deploy-production
          bin/deploy-production "$RELEASE_ARTIFACT" "$RELEASE_SHA"

      - name: Mark immutable candidate promoted
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOYMENT_ID: ${{ steps.receipt.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: >-
          bin/record-production-deployment finish "$DEPLOYMENT_ID" promoted
          "$PRODUCTION_URL"

      - name: Activate promoted production candidate
        id: activation
        if: >-
          vars.PRODUCTION_ACTIVATION_MODE == 'separate-command' &&
          steps.receipt.outputs.already_successful != 'true' &&
          (steps.receipt.outputs.already_promoted == 'true' ||
           steps.recovery_receipt.outcome == 'success' ||
           steps.deploy.outcome == 'success')
        continue-on-error: true
        env:
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: bin/activate-production "$RELEASE_ARTIFACT" "$RELEASE_SHA"

      - name: Verify activated production candidate
        id: production
        if: >-
          steps.activation.outcome != 'failure' &&
          (steps.receipt.outputs.already_promoted == 'true' ||
           steps.recovery_receipt.outcome == 'success' ||
           steps.deploy.outcome == 'success')
        continue-on-error: true
        env:
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          test -x bin/verify-production
          smoke_summary="$(bin/verify-production)"
          {
            echo "smoke<<PRODUCTION_SMOKE"
            echo "$smoke_summary"
            echo "PRODUCTION_SMOKE"
          } >> "$GITHUB_OUTPUT"

      - name: Record production receipt status
        if: always()
        env:
          DEPLOYMENT_ID: ${{ steps.receipt.outputs.deployment_id }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          [[ -n "$DEPLOYMENT_ID" ]] || exit 1
          if [[ "${{ steps.deploy.outcome }}" == "failure" ]]; then
            bin/record-production-deployment finish "$DEPLOYMENT_ID" failure \
              "$PRODUCTION_URL" "Production promotion failed"
            exit 1
          fi
          if [[ "${{ steps.production.outcome }}" != "success" ]]; then
            echo "Production verification failed; the promoted receipt remains resumable." >&2
            exit 1
          fi
          if [[ "${{ steps.activation.outcome }}" == "failure" ]]; then
            echo "Production activation failed; the promoted receipt remains resumable." >&2
            exit 1
          fi
          bin/record-production-deployment finish "$DEPLOYMENT_ID" success \
            "$PRODUCTION_URL" "Production candidate verified"

      - name: Publish production ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_ROLLBACK: ${{ inputs.rollback }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
          PRODUCTION_DEPLOYMENT_ID: ${{ steps.receipt.outputs.deployment_id }}
          RELEASE_CONTROL_SHA: ${{ steps.receipt.outputs.control_sha }}
          SMOKE_SUMMARY: ${{ steps.production.outputs.smoke }}
        run: bin/finalize-release production
